<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tea break order · Garage Apex</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EFEFED; --card:#FFFFFF; --ink:#111112; --muted:#66666B; --line:#DADAD6;
  --red:#D8171E; --on-red:#FFFFFF; --red-soft:rgba(216,23,30,.09);
  --bar:#0A0A0B; --on-bar:#FFFFFF; --bar-dim:#3A3A3E;
  --tint:rgba(17,17,18,.05);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
/* Light is the default. Dark only when the person switches it on. */
:root[data-theme="dark"]{
  --bg:#0C0C0D; --card:#171718; --ink:#F3F3F1; --muted:#9C9CA2; --line:#2B2B2E;
  --red:#EE3038; --on-red:#FFFFFF; --red-soft:rgba(238,48,56,.14);
  --bar:#000000; --bar-dim:#2E2E32;
  --tint:rgba(255,255,255,.06);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 100px)}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent;
}
.disp{font-family:"Barlow Condensed","Arial Narrow",Impact,system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--red);outline-offset:2px}

/* ---------- Top bar: brand + live total + tach ---------- */
.bar{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:10;
  background:var(--bar);color:var(--on-bar);
  padding:12px 16px 12px;
  border-bottom:3px solid var(--red);
}
.bar-in{max-width:520px;margin:0 auto}
.bar-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px}
.slash{width:12px;height:30px;background:var(--red);transform:skewX(-18deg);border-radius:1px}
.wordmark{font-weight:800;font-size:1.45rem;letter-spacing:.06em;line-height:1;text-transform:uppercase}
.wordmark small{display:block;font-weight:500;font-size:.78rem;letter-spacing:.18em;color:#A9A9AF;margin-top:3px}
.odo{display:flex;align-items:baseline;gap:6px}
.odo b{font-weight:800;font-size:2.7rem;line-height:.9;font-variant-numeric:tabular-nums;min-width:1.2ch;text-align:right}
.odo span{font-weight:600;font-size:.95rem;letter-spacing:.1em;color:#A9A9AF;text-transform:uppercase}
.tach{display:flex;gap:3px;margin-top:10px}
.tach i{flex:1;height:7px;background:var(--bar-dim);transform:skewX(-18deg);border-radius:1px;transition:background .12s}
.tach i.on{background:#F3F3F1}
.tach i.on.hot{background:var(--red)}

/* ---------- Page ---------- */
.wrap{max-width:520px;margin:0 auto;padding:18px 16px 36px}
.head{margin:2px 2px 16px}
h1{margin:0;font-weight:800;font-size:2.1rem;line-height:1;letter-spacing:.01em;text-transform:uppercase}
.date{margin:6px 0 0;color:var(--muted);font-size:.95rem}

/* ---------- Drink card ---------- */
.card{
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:14px;margin-bottom:12px;position:relative;overflow:hidden;
}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--line);transition:background .15s}
.card.has::before{background:var(--red)}
.top{display:flex;align-items:center;gap:12px;padding-left:4px}
.cup{width:52px;height:52px;flex:none;color:var(--ink)}
.cup .liq{fill:var(--c)}
.cup .shell,.cup .handle,.cup .steam{fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.cup .steam{opacity:.45}
.who{flex:1;min-width:0}
.name{font-weight:700;font-size:1.65rem;line-height:1;letter-spacing:.01em}
.sub{margin-top:5px;font-size:.88rem;color:var(--muted);min-height:1.2em}
.stepper{display:flex;align-items:center;gap:4px}
.step{
  width:56px;height:56px;border-radius:12px;border:2px solid var(--line);background:transparent;
  display:grid;place-items:center;padding:0;font-size:2rem;line-height:1;font-weight:500;color:var(--ink);
}
.step.plus{width:64px;height:64px;background:var(--red);border-color:var(--red);color:var(--on-red);font-weight:600}
.step:active{transform:scale(.93)}
.step:disabled{opacity:.28;cursor:default}
.num{min-width:2ch;text-align:center;font-weight:800;font-size:3rem;line-height:1;font-variant-numeric:tabular-nums}
.num.bump{animation:bump .18s ease-out}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}

/* ---------- Sugar ---------- */
.sugar{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;padding-left:4px}
.sg{
  display:flex;align-items:center;justify-content:space-between;gap:4px;
  background:var(--tint);border:1.5px solid transparent;border-radius:12px;padding:5px 5px 5px 12px;
  transition:background .12s,border-color .12s;
}
.sg.on{background:var(--red-soft);border-color:var(--red)}
.sg .lbl{font-weight:600;font-size:1.05rem;line-height:1.05}
.mini{display:flex;align-items:center}
.mini button{
  width:42px;height:42px;border-radius:10px;border:0;background:transparent;font-size:1.5rem;line-height:1;padding:0;color:var(--ink);
}
.mini button:active{background:var(--tint)}
.mini button:disabled{opacity:.25;cursor:default}
.mini output{min-width:1.4ch;text-align:center;font-weight:800;font-size:1.5rem;font-variant-numeric:tabular-nums}

/* ---------- Kitchen ticket ---------- */
.ticket{
  background:var(--card);border:1px solid var(--line);border-radius:14px;margin-top:20px;overflow:hidden;
}
.ticket-h{display:flex;justify-content:space-between;align-items:center;background:var(--bar);color:var(--on-bar);padding:12px 16px}
.ticket-h h2{margin:0;font-weight:700;font-size:1.3rem;letter-spacing:.05em;text-transform:uppercase}
.ticket-h span{font-weight:600;letter-spacing:.08em;color:#A9A9AF;font-size:.9rem}
.lines{padding:6px 16px}
.ln{display:flex;align-items:baseline;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line)}
.ln:last-child{border-bottom:0}
.ln .q{font-weight:800;font-size:2rem;line-height:1;min-width:1.6ch;color:var(--red);font-variant-numeric:tabular-nums}
.ln .d{font-weight:700;font-size:1.5rem;line-height:1.05}
.ln .n{display:block;font-family:"Barlow",system-ui,sans-serif;font-weight:500;font-size:.95rem;color:var(--muted);margin-top:3px}
.none{padding:22px 16px;color:var(--muted)}
.actions{display:flex;gap:10px;padding:12px 16px 16px;border-top:1px solid var(--line)}
.btn{
  flex:1;height:52px;border-radius:12px;border:2px solid var(--ink);background:transparent;
  font-weight:700;font-size:1.3rem;letter-spacing:.06em;text-transform:uppercase;
}
.btn.primary{background:var(--red);border-color:var(--red);color:var(--on-red)}
.btn.quiet{flex:0 0 auto;padding:0 18px;border-color:var(--line);color:var(--muted)}
.btn.quiet.armed{border-color:var(--red);color:var(--red)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.35;cursor:default}
.note{min-height:1.2em;margin:0;padding:0 16px 14px;color:var(--muted);font-size:.9rem}
.foot{margin:22px 0 0;text-align:center;color:var(--muted);font-size:.85rem;letter-spacing:.04em}

@media (prefers-reduced-motion:reduce){
  .num.bump{animation:none}
  .tach i{transition:none}
}
@media (max-width:370px){
  .name{font-size:1.4rem}
  .step{width:48px;height:48px}.step.plus{width:56px;height:56px}
  .num{font-size:2.5rem}
  .cup{display:none}
}
.right{display:flex;align-items:center;gap:14px}
.theme{
  display:flex;align-items:center;gap:2px;padding:3px;border-radius:999px;
  background:#1E1E21;border:1px solid #34343A;
}
.theme button{
  width:38px;height:34px;border-radius:999px;border:0;background:transparent;color:#A9A9AF;
  display:grid;place-items:center;padding:0;
}
.theme button svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.theme button[aria-pressed="true"]{background:var(--red);color:#fff}
.theme button:focus-visible{outline:3px solid #fff;outline-offset:1px}
@media (max-width:370px){.theme button{width:32px}.right{gap:8px}}
</style>
<script>
(function(){
  try{
    var t = localStorage.getItem('teabreak-theme');
    document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
  }catch(e){ document.documentElement.setAttribute('data-theme','light'); }
})();
</script>
</head>
<body>

<header class="bar">
  <div class="bar-in">
    <div class="bar-row">
      <div class="brand disp">
        <div class="slash" aria-hidden="true"></div>
        <div class="wordmark">Apex<small>Tea break</small></div>
      </div>
      <div class="right">
        <div class="theme" role="group" aria-label="Colour theme">
          <button type="button" id="th-light" aria-pressed="true" aria-label="Light mode">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          </button>
          <button type="button" id="th-dark" aria-pressed="false" aria-label="Dark mode">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          </button>
        </div>
        <div class="odo disp" aria-live="polite"><b id="total">0</b><span>cups</span></div>
      </div>
    </div>
    <div class="tach" id="tach" aria-hidden="true"></div>
  </div>
</header>

<div class="wrap">
  <div class="head">
    <h1 class="disp">Count the cups</h1>
    <p class="date" id="date"></p>
  </div>

  <main id="drinks"></main>

  <section class="ticket" aria-label="Order for the kitchen">
    <div class="ticket-h disp"><h2>Kitchen order</h2><span id="tcount"></span></div>
    <div id="lines"></div>
    <div class="actions disp">
      <button class="btn primary" id="copy">Copy order</button>
      <button class="btn quiet" id="reset">Clear</button>
    </div>
    <p class="note" id="note" aria-live="polite"></p>
  </section>

</div>

<script>
(function(){
  var DRINKS = [
    {id:'coffee',  name:'Coffee',    c:'#5A3826'},
    {id:'plain',   name:'Plain Tea', c:'#D39A2E'},
    {id:'milk',    name:'Milk Tea',  c:'#D9B58F'},
    {id:'nescafe', name:'Nescafe',   c:'#A8512B'}
  ];
  var KEY = 'teabreak-counts-v3';
  var SEGS = 20, HOT = 16;
  var state = {};
  DRINKS.forEach(function(d){ state[d.id] = {n:0, hi:0, lo:0}; });

  function today(){
    var t = new Date();
    return t.getFullYear()+'-'+(t.getMonth()+1)+'-'+t.getDate();
  }
  function load(){
    try{
      var raw = localStorage.getItem(KEY);
      if(!raw) return;
      var saved = JSON.parse(raw);
      if(!saved || saved.day !== today()) return;
      DRINKS.forEach(function(d){
        var s = saved.data && saved.data[d.id];
        if(s) state[d.id] = {n:s.n|0, hi:s.hi|0, lo:s.lo|0};
      });
    }catch(e){}
  }
  function save(){
    try{ localStorage.setItem(KEY, JSON.stringify({day:today(), data:state})); }catch(e){}
  }
  function buzz(){ try{ if(navigator.vibrate) navigator.vibrate(8); }catch(e){} }

  function fix(s){
    if(s.n < 0) s.n = 0;
    if(s.hi + s.lo > s.n){
      var over = s.hi + s.lo - s.n;
      var cut = Math.min(over, s.lo); s.lo -= cut; over -= cut;
      s.hi -= over;
    }
  }

  /* tach segments */
  var tach = document.getElementById('tach');
  var segs = [];
  for(var i=0;i<SEGS;i++){
    var el = document.createElement('i');
    if(i >= HOT) el.className = 'hot';
    tach.appendChild(el); segs.push(el);
  }

  var host = document.getElementById('drinks');
  var els = {};

  function cupSvg(c){
    return '<svg class="cup" viewBox="0 0 48 48" aria-hidden="true" style="--c:'+c+'">' +
      '<path class="steam" d="M15 4c-2 3 2 4 0 8M23 4c-2 3 2 4 0 8"/>' +
      '<path class="liq" d="M8 18h26v8a11 11 0 0 1-11 11h-4A11 11 0 0 1 8 26z"/>' +
      '<path class="shell" d="M8 18h26v8a11 11 0 0 1-11 11h-4A11 11 0 0 1 8 26z"/>' +
      '<path class="handle" d="M34 21h2.5a5 5 0 0 1 0 10H33"/>' +
      '<path class="shell" d="M12 43h18"/>' +
      '</svg>';
  }

  function build(){
    DRINKS.forEach(function(d){
      var card = document.createElement('section');
      card.className = 'card';
      card.innerHTML =
        '<div class="top">' +
          cupSvg(d.c) +
          '<div class="who"><div class="name disp">'+d.name+'</div><div class="sub"></div></div>' +
          '<div class="stepper">' +
            '<button class="step minus" aria-label="One less '+d.name+'">&minus;</button>' +
            '<div class="num disp" aria-live="polite">0</div>' +
            '<button class="step plus" aria-label="One more '+d.name+'">+</button>' +
          '</div>' +
        '</div>' +
        '<div class="sugar">' +
          '<div class="sg hi"><div class="lbl disp">High sugar</div>' +
            '<div class="mini disp"><button class="m" aria-label="Less high sugar '+d.name+'">&minus;</button><output>0</output><button class="p" aria-label="More high sugar '+d.name+'">+</button></div></div>' +
          '<div class="sg lo"><div class="lbl disp">Low sugar</div>' +
            '<div class="mini disp"><button class="m" aria-label="Less low sugar '+d.name+'">&minus;</button><output>0</output><button class="p" aria-label="More low sugar '+d.name+'">+</button></div></div>' +
        '</div>';
      host.appendChild(card);
      var q = function(sel){ return card.querySelector(sel); };
      var e = els[d.id] = {
        card:card, num:q('.num'), sub:q('.sub'), minus:q('.minus'), plus:q('.plus'),
        hiBox:q('.sg.hi'), loBox:q('.sg.lo'),
        hiOut:q('.sg.hi output'), loOut:q('.sg.lo output'),
        hiM:q('.sg.hi .m'), hiP:q('.sg.hi .p'), loM:q('.sg.lo .m'), loP:q('.sg.lo .p'),
        last:0
      };
      var s = state[d.id];
      e.plus.onclick  = function(){ s.n++; buzz(); update(); };
      e.minus.onclick = function(){ if(s.n>0){ s.n--; fix(s); buzz(); update(); } };
      e.hiP.onclick = function(){ if(s.hi+s.lo < s.n){ s.hi++; buzz(); update(); } };
      e.hiM.onclick = function(){ if(s.hi>0){ s.hi--; buzz(); update(); } };
      e.loP.onclick = function(){ if(s.hi+s.lo < s.n){ s.lo++; buzz(); update(); } };
      e.loM.onclick = function(){ if(s.lo>0){ s.lo--; buzz(); update(); } };
    });
  }

  function notes(s){
    var parts = [];
    if(s.hi) parts.push(s.hi + ' high sugar');
    if(s.lo) parts.push(s.lo + ' low sugar');
    return parts.join(', ');
  }

  function orderText(){
    var lines = [];
    DRINKS.forEach(function(d){
      var s = state[d.id];
      if(s.n > 0){
        var n = notes(s);
        lines.push(s.n + ' ' + d.name + (n ? ' (' + n + ')' : ''));
      }
    });
    return lines.join('\n');
  }

  function renderLines(){
    var box = document.getElementById('lines');
    box.innerHTML = '';
    var any = false;
    var wrap = document.createElement('div');
    wrap.className = 'lines';
    DRINKS.forEach(function(d){
      var s = state[d.id];
      if(s.n <= 0) return;
      any = true;
      var row = document.createElement('div');
      row.className = 'ln disp';
      var n = notes(s);
      var normal = s.n - s.hi - s.lo;
      var detail = n || 'normal sugar';
      if(n && normal > 0) detail = normal + ' normal, ' + n;
      row.innerHTML = '<div class="q">'+s.n+'</div><div class="d">'+d.name+'<span class="n">'+detail+'</span></div>';
      wrap.appendChild(row);
    });
    if(any) box.appendChild(wrap);
    else {
      var none = document.createElement('div');
      none.className = 'none';
      none.textContent = 'Nothing counted yet. Tap + on a drink to start.';
      box.appendChild(none);
    }
    return any;
  }

  function update(){
    var total = 0;
    DRINKS.forEach(function(d){
      var s = state[d.id], e = els[d.id];
      fix(s);
      total += s.n;
      if(e.last !== s.n){
        e.num.classList.remove('bump'); void e.num.offsetWidth; e.num.classList.add('bump');
        e.last = s.n;
      }
      e.num.textContent = s.n;
      e.card.classList.toggle('has', s.n > 0);
      e.minus.disabled = s.n === 0;
      e.hiOut.textContent = s.hi;
      e.loOut.textContent = s.lo;
      var room = s.hi + s.lo < s.n;
      e.hiP.disabled = !room; e.loP.disabled = !room;
      e.hiM.disabled = s.hi === 0; e.loM.disabled = s.lo === 0;
      e.hiBox.classList.toggle('on', s.hi > 0);
      e.loBox.classList.toggle('on', s.lo > 0);
      e.sub.textContent = s.n === 0 ? '' : (s.n - s.hi - s.lo) + ' normal sugar';
    });
    document.getElementById('total').textContent = total;
    for(var i=0;i<SEGS;i++) segs[i].classList.toggle('on', i < total);
    var any = renderLines();
    document.getElementById('tcount').textContent = any ? total + (total === 1 ? ' cup' : ' cups') : '';
    document.getElementById('copy').disabled = !any;
    save();
  }

  var noteT;
  function setNote(msg){
    var n = document.getElementById('note');
    n.textContent = msg;
    clearTimeout(noteT);
    noteT = setTimeout(function(){ n.textContent = ''; }, 2500);
  }

  document.getElementById('copy').onclick = function(){
    var total = document.getElementById('total').textContent;
    var txt = 'Tea break order\n' + orderText() + '\nTotal: ' + total;
    function fallback(){
      try{
        var ta = document.createElement('textarea');
        ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        var ok = document.execCommand('copy'); document.body.removeChild(ta);
        setNote(ok ? 'Copied. Paste it to the kitchen.' : 'Could not copy. Read the order out instead.');
      }catch(e){ setNote('Could not copy. Read the order out instead.'); }
    }
    try{
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(txt).then(function(){ setNote('Copied. Paste it to the kitchen.'); }, fallback);
      } else fallback();
    }catch(e){ fallback(); }
  };

  var resetBtn = document.getElementById('reset');
  var armed = false, timer;
  resetBtn.onclick = function(){
    if(!armed){
      armed = true; resetBtn.textContent = 'Tap to confirm'; resetBtn.classList.add('armed');
      timer = setTimeout(function(){ armed = false; resetBtn.textContent = 'Clear'; resetBtn.classList.remove('armed'); }, 3000);
      return;
    }
    clearTimeout(timer); armed = false; resetBtn.textContent = 'Clear'; resetBtn.classList.remove('armed');
    DRINKS.forEach(function(d){ var s = state[d.id]; s.n = 0; s.hi = 0; s.lo = 0; });
    update();
  };

  document.getElementById('date').textContent =
    new Date().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'});

  /* theme toggle: light by default */
  var root = document.documentElement;
  var bL = document.getElementById('th-light'), bD = document.getElementById('th-dark');
  function applyTheme(t, persist){
    root.setAttribute('data-theme', t);
    bL.setAttribute('aria-pressed', t === 'light' ? 'true' : 'false');
    bD.setAttribute('aria-pressed', t === 'dark' ? 'true' : 'false');
    if(persist){ try{ localStorage.setItem('teabreak-theme', t); }catch(e){} }
  }
  bL.onclick = function(){ applyTheme('light', true); };
  bD.onclick = function(){ applyTheme('dark', true); };
  applyTheme(root.getAttribute('data-theme') === 'dark' ? 'dark' : 'light', false);

  load(); build(); update();
})();
</script>
</body>
</html>
